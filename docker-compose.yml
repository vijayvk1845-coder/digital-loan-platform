services:

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: loan_origination_db
      POSTGRES_USER: loan_admin
      POSTGRES_PASSWORD: change_me
    ports:
      - "15433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    networks:
      - loan-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "18000:5000"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: loan_origination_db
      DB_USER: loan_admin
      DB_PASSWORD: change_me
      JWT_SECRET: replace_with_a_strong_secret
    depends_on:
      - database
    networks:
      - loan-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "18080:80"
    depends_on:
      - backend
    networks:
      - loan-net

volumes:
  db-data:

networks:
  loan-net:
    driver: bridge